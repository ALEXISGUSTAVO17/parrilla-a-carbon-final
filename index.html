<body><div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ─── Levenshtein & fuzzy helpers ──────────────────────────────────────────────
const lev=(a,b)=>{
  const m=a.length,n=b.length;
  if(Math.abs(m-n)>4)return 99;
  const d=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);
  return d[m][n];
};
const norm=s=>s.toLowerCase().replace(/[\s\-_\.]/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');

// ─── Section keyword families (fuzzy-matched) ─────────────────────────────────
// Each family: [canonical, ...variants]. Threshold = floor(canonical.length * 0.45)
const KEYWORD_FAMILIES = {
  players:  ['jugadores','players','jugadore','jugaores','jugadres','participantes','lista'],
  cashout:  ['cashout','cashouts','cashao','cashaout','chasout','cachout','caishaout','cashut',
             'cashoutt','kashaout','cash','cashot','cashao','casho','kasho','kashaout','ganancias','ganadores','premios','resultados'],
  rebuy:    ['rebuy','rebuys','ribuy','ribuys','ribeye','ribui','rebui','rebays','rebuay',
             'rib-eye','re-buy','re-buys','ribay','ribeys','riboys','rybuy','reboy'],
};

function matchKeywordFamily(word){
  const w=norm(word);
  for(const[family,variants]of Object.entries(KEYWORD_FAMILIES)){
    for(const v of variants){
      const nv=norm(v);
      const threshold=Math.max(1,Math.floor(nv.length*0.45));
      if(lev(w,nv)<=threshold)return family;
    }
  }
  return null;
}

// ─── Hard reserved (exact, never player names) ────────────────────────────────
const RES=new Set(['rebuy','rebuys','cashout','cashouts','jugadores','players','premios',
  'resultados','ganadores','pagos','total','lista','poker','partida','torneo','buy-in','buyin',
  'buy','in','fecha','lugar','casa','noche','resumen','ganancia','perdida','pérdida',
  'transferencias','carbón','carbon','a','de','donde','lo','en','ok','cerrado','sellado',
  'cashao','cashaout','kasho','chasout','ribuy','ribeye','ribui']);

// ─── Other utils ──────────────────────────────────────────────────────────────
const similar=(a,b)=>{
  const la=a.toLowerCase().trim(),lb=b.toLowerCase().trim();
  if(la===lb)return false;
  // Prefix match: "jean" ↔ "jeanpi" (one is a prefix of the other, diff ≤ 3 chars)
  const shorter=la.length<lb.length?la:lb, longer=la.length<lb.length?lb:la;
  if(longer.startsWith(shorter)&&longer.length-shorter.length<=3)return true;
  // Short names (≤4 chars) → distance ≤ 1 only (avoids Chon≈choco false positives)
  const minLen=Math.min(la.length,lb.length);
  const threshold=minLen<=4?1:2;
  return lev(la,lb)<=threshold&&Math.abs(la.length-lb.length)<=3;
};
const pm=str=>parseInt(String(str||0).replace(/[^0-9]/g,''))||0;
const fmt=n=>'$'+Math.abs(n).toLocaleString('es-CL');
const fmtS=n=>(n>0?'+':'')+fmt(n);
const rnd=arr=>arr[Math.floor(Math.random()*arr.length)];
const uid=()=>Date.now()+Math.random();

function parseDate(text){
  const MONTHS={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
  const p1=text.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if(p1){const y=p1[3].length===2?'20'+p1[3]:p1[3];return`${p1[1].padStart(2,'0')}/${p1[2].padStart(2,'0')}/${y}`;}
  const p2=text.match(/\b(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+(?:de\s+)?(\d{4})/i);
  if(p2){return`${p2[1].padStart(2,'0')}/${String(MONTHS[p2[2].toLowerCase()]).padStart(2,'0')}/${p2[3]}`;}
  return null;
}
function getMonth(d){if(!d)return'sin-fecha';const p=d.split('/');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}`:'sin-fecha';}
function labelMonth(m){if(!m||m==='sin-fecha')return'Sin fecha';const[y,mo]=m.split('-');const N=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];return`${N[parseInt(mo)-1]} ${y}`;}

function minimizeTx(players){
  const bal=players.map(p=>({name:p.name,bal:p.finalBalance})).filter(b=>Math.abs(b.bal)>1);
  const tx=[],dbt=[...bal.filter(b=>b.bal<0)].sort((a,b)=>a.bal-b.bal),crd=[...bal.filter(b=>b.bal>0)].sort((a,b)=>b.bal-a.bal);
  let i=0,j=0;
  while(i<dbt.length&&j<crd.length){const amt=Math.min(Math.abs(dbt[i].bal),crd[j].bal);if(amt>1)tx.push({from:dbt[i].name,to:crd[j].name,amount:Math.round(amt)});dbt[i].bal+=amt;crd[j].bal-=amt;if(Math.abs(dbt[i].bal)<1)i++;if(crd[j].bal<1)j++;}
  return tx;
}

// ─── COMEDY ENGINE ────────────────────────────────────────────────────────────
const PLAYER_COUNT_JOKES={
  2:"Dos jugadores. Esto no es poker, es una pelea de ego con naipes.",
  3:"Tres jugadores. El mínimo para que alguien tenga excusa: 'me intimidaron entre los dos'.",
  4:"Cuatro en la mesa. El formato más honesto: todos saben quién les robó.",
  5:"Cinco jugadores. Número de suerte... para uno solo. Los otros cuatro, no tanto.",
  6:"Seis jugadores. Ya empieza a parecer casino. Faltan las luces de neón y el señor de seguridad.",
  7:"Siete personas. Siete historias distintas de cómo 'iba a ir todo bien esta noche'.",
  8:"Ocho jugadores. El caos empieza a tener estructura. O sea, más caos.",
  9:"Nueve jugadores. El organizador ya está arrepentido pero no lo admitirá jamás.",
  10:"Diez exactos. Mesa llena. Estadísticamente, el 90% va a mentir sobre cómo jugó.",
  11:"Once o más. Esto ya es un evento. Faltan sponsors, cámaras y transmisión en vivo.",
};

const ACHIEVEMENTS=[
  {id:'paz',check:(s)=>s.players.every(p=>!p.rebuys||p.rebuys===0),emoji:'🕊️',title:'La Paz Perpetua',desc:'Nadie rebuyó. Primera vez para todo.'},
  {id:'infierno',check:(s)=>s.players.reduce((a,p)=>a+(parseInt(p.rebuys)||0),0)>s.players.length,emoji:'🔥',title:'El Infierno en Vida',desc:'Más rebuys que jugadores. Épico.'},
  {id:'clean_win',check:(s)=>{const w=[...s.players].sort((a,b)=>b.pokerBalance-a.pokerBalance)[0];return w&&w.pokerBalance>0&&!w.rebuys;},emoji:'🥷',title:'El Golpe Limpio',desc:'El ganador no necesitó ni un rebuy. Puro talento (o suerte, pero no se lo digamos).'},
  {id:'bigpot',check:(s)=>s.players.reduce((a,p)=>a+p.investment,0)>s.buyIn*s.players.length*1.5,emoji:'💰',title:'La Noche del Millón',desc:'El pot superó 1.5× lo esperado. Alguien (o varios) no sabían cuándo parar.'},
  {id:'empate_moral',check:(s)=>s.players.filter(p=>Math.abs(p.pokerBalance)<s.buyIn*0.05).length>=2,emoji:'🤝',title:'Empate Moral',desc:'Al menos dos personas terminaron prácticamente igual. Los contadores involuntarios.'},
  {id:'solo_rebuy',check:(s)=>s.players.filter(p=>(parseInt(p.rebuys)||0)>0).length===1,emoji:'🎯',title:'El Elegido',desc:'Solo uno rebuyó. El resto tuvo misericordia (o ya no tenía efectivo).'},
  {id:'masacre',check:(s)=>{const sorted=[...s.players].sort((a,b)=>b.pokerBalance-a.pokerBalance);return sorted[0]?.pokerBalance>0&&sorted[sorted.length-1]?.pokerBalance<-s.buyIn*2;},emoji:'🩸',title:'La Masacre',desc:'El último lugar perdió más del doble del buy-in. Minuto de silencio.'},
  {id:'full_house_real',check:(s)=>s.players.length>=8,emoji:'🏟️',title:'Full House',desc:'8 o más jugadores. La casa grande se quedó pequeña.'},
];

function getAchievements(session){
  return ACHIEVEMENTS.filter(a=>{try{return a.check(session);}catch(_){return false;}});
}

function generateComments(session){
  const pls=session.players||[];if(!pls.length)return[];
  const sorted=[...pls].sort((a,b)=>b.pokerBalance-a.pokerBalance);
  const winner=sorted[0],loser=sorted[sorted.length-1];
  const donador=[...pls].sort((a,b)=>(b.rebuys||0)-(a.rebuys||0))[0];
  const pot=pls.reduce((s,p)=>s+p.investment,0);
  const loc=session.location||session.title||'la mesa';
  const n=pls.length;
  const even=pls.find(p=>Math.abs(p.pokerBalance)<pot*0.06&&p.name!==winner?.name&&p.name!==loser?.name);
  const comments=[];

  // Player count joke
  const maxKey=Math.min(n,11);
  comments.push(PLAYER_COUNT_JOKES[maxKey]||PLAYER_COUNT_JOKES[11]);

  if(winner?.pokerBalance>0)comments.push(rnd([
    `🔥 ${winner.name} se fue la raja de ${loc}. ${fmt(winner.pokerBalance)} que hablan por sí solos.`,
    `💸 ${winner.name} ganó ${fmt(winner.pokerBalance)}. El Uber de regreso iba cantando.`,
    `👑 ${winner.name} recordó esta noche por qué le gusta el poker. Los demás recordaron por qué a veces lo odian.`,
    `🎰 ${winner.name}: ${fmt(winner.pokerBalance)}. "No es suerte, es lectura de mesa." Claro que sí.`,
    `🃏 ${winner.name} salió con ${fmt(winner.pokerBalance)} ajenos. Delicioso, objetivamente.`,
  ]));

  if(loser?.pokerBalance<0)comments.push(rnd([
    `😭 ${loser.name} "invirtió" ${fmt(Math.abs(loser.pokerBalance))} esta noche. Retorno: aprendizaje. (Spoiler: no aprendió.)`,
    `🩸 ${loser.name} donó ${fmt(Math.abs(loser.pokerBalance))} al grupo. Filántropo involuntario del año.`,
    `💀 ${loser.name} salió ${fmt(Math.abs(loser.pokerBalance))} más liviano. La buena noticia: hay revancha. La mala: hay revancha.`,
    `🤡 ${loser.name} jugó bien... según ${loser.name}. La mesa tiene otra versión. Las matemáticas también.`,
    `🫠 ${loser.name}: ${fmtS(loser.pokerBalance)}. No hay forma bonita de decirlo.`,
  ]));

  if(donador?.rebuys>0)comments.push(rnd([
    `🔄 "${donador.name} ahora sí la rompo" — dicho ${donador.rebuys} vez${donador.rebuys>1?'es':''} con creciente desesperación.`,
    `💉 ${donador.name}: ${donador.rebuys} rebuy${donador.rebuys>1?'s':''}. La definición clínica de esperanza.`,
    `🎯 ${donador.name} con ${donador.rebuys} rebuy${donador.rebuys>1?'s':''}: optimismo involuntario de alto nivel.`,
    `📈 ${donador.name} invirtió en el grupo ${donador.rebuys} vez${donador.rebuys>1?'es':''}. El ROI: negativo. La energía: incomprensible.`,
  ]));

  if(even)comments.push(rnd([
    `🥚 ${even.name} terminó casi igual que como entró. Talento especial para quedar ni-chicha-ni-limonada.`,
    `⚖️ ${even.name}: el equilibrio cósmico de la noche. Ni ganó ni perdió. Estuvo. Y eso es suficiente. (Mentira, no es suficiente.)`,
    `😑 ${even.name} estuvo ${Math.round(Math.abs(even.pokerBalance)/pot*100)}% presente toda la noche para terminar en cero. Arte performance.`,
  ]));

  // Pot comment
  comments.push(rnd([
    `💰 ${fmt(pot)} en juego esta noche en ${loc}. Que nadie diga que falta fe ni efectivo.`,
    `🃏 ${n} jugadores, ${fmt(pot)} sobre la mesa. Las matemáticas del cariño entre amigos.`,
    `💵 El pot total fue ${fmt(pot)}. La mayoría ya lo estaba pensando en cervezas.`,
  ]));

  // Frase icónica de la noche (fake quotes)
  const quotes=[];
  if(donador?.rebuys>1)quotes.push(`💬 Frase de la noche — ${donador.name}: "Esta es LA última vez que rebuyo, de verdad." (×${donador.rebuys})`);
  if(winner?.pokerBalance>pot*0.4)quotes.push(`💬 Frase de la noche — ${winner.name}: "Yo sabía que iba a ganar desde el primer hand."`);
  if(loser?.pokerBalance<-pot*0.35)quotes.push(`💬 Frase de la noche — ${loser.name}: "Las cartas estuvieron en mi contra TODA la noche." (x${n} testigos que no confirman.)`);
  if(n>=7)quotes.push(`💬 Frase de la noche — El organizador: "La próxima lo hacemos más pequeño." (Spoiler: no lo harán.)`);
  if(quotes.length)comments.push(rnd(quotes));

  return comments.slice(0,5);
}

// ─── Parser ───────────────────────────────────────────────────────────────────
function stripWATimestamp(line){
  const w1=line.match(/^\[[\d\/,\s:]+\]\s*[^:]+:\s*(.*)/);if(w1)return w1[1].trim();
  const w2=line.match(/^\d{1,2}\/\d{1,2}\/\d{2,4},\s*\d{1,2}:\d{2}\s*(?:AM|PM)?\s*-\s*[^:]+:\s*(.*)/i);if(w2)return w2[1].trim();
  return line.trim();
}

function parseBlock(rawText){
  const lines=rawText.split('\n').map(stripWATimestamp).filter(Boolean);
  let title='',parsedPlayers=[],cashoutMap={},mode=null;
  const dateStr=parseDate(rawText);
  const correctionLog=[]; // track fuzzy keyword corrections

  for(const line of lines){
    const clean=line.replace(/[🃏🎲♠♥♦♣*_~✓✗•🔥💸🩸]/g,'').trim();
    const lower=clean.toLowerCase().replace(/[:\.\!\?]/g,'').trim();
    if(!lower)continue;

    // Title detection
    if(!title&&/casa de|poker en|poker donde|partida|torneo|noche de|carbón|carbon/i.test(lower)){
      title=clean.replace(/[-–—]\s*[\d\/].*$/,'').trim();continue;
    }

    // Mode switch via fuzzy keyword matching
    const family=matchKeywordFamily(lower.split(/[\s:]/)[0]);
    if(family==='players'){mode='players';continue;}
    if(family==='cashout'){mode='cashout';continue;}
    if(family==='rebuy')continue; // "Rebuys:" header line — skip

    // Also check full line as keyword (e.g. line is just "cashao" or "ribeye")
    const fullFamily=matchKeywordFamily(lower);
    if(fullFamily){
      if(fullFamily==='players'){mode='players';continue;}
      if(fullFamily==='cashout'){mode='cashout';continue;}
      if(fullFamily==='rebuy')continue;
    }

    // Exact reserved check
    if(RES.has(lower)||RES.has(lower.replace(/s$/,'')))continue;

    // ── Comma-separated name list: "Jaques, Alfredo, choco," ──────────────────
    if(clean.includes(',')&&!clean.includes(':')){
      const parts=clean.split(',').map(p=>p.trim()).filter(p=>p.length>=2&&p.length<=25);
      const allNames=parts.length>=2&&parts.every(p=>/^[A-Za-záéíóúñÁÉÍÓÚÑ]/.test(p)&&!/\d/.test(p)&&!RES.has(p.toLowerCase()));
      if(allNames){
        for(const part of parts){
          if(!part||RES.has(part.toLowerCase()))continue;
          const existExact=parsedPlayers.find(p=>p.name.toLowerCase()===part.toLowerCase());
          if(!existExact){
            const existFuzzy=parsedPlayers.find(p=>similar(p.name,part));
            if(!existFuzzy)parsedPlayers.push({id:uid(),name:part,rebuys:0,cashout:0});
          }
        }
        if(!mode)mode='players';
        continue;
      }
    }

    // Cashout line: "Name: $amount" or "Name - amount"
    const cm=clean.match(/^([A-Za-záéíóúñÁÉÍÓÚÑ][^:–\-0-9]{1,25}?)\s*[:\-–]\s*([\$0-9.,]+)\s*$/);
    if(cm&&pm(cm[2])>=0){
      const cn=cm[1].trim();
      if(!RES.has(cn.toLowerCase())&&!matchKeywordFamily(cn.toLowerCase())){
        cashoutMap[cn.toLowerCase()]={name:cn,amount:pm(cm[2])};
        if(mode!=='players')mode='cashout';
      }
      continue;
    }

    // Player line — detect rebuys in all formats
    // Formats: "Alfredo1", "Alfredo 1", "Alfredo - 2", "Alfredo x2", "Alfredo (2 rebuys)", "Alfredo ribeye" (typo)
    const gm=clean.match(/^([A-Za-záéíóúñÁÉÍÓÚÑ][A-Za-záéíóúñÁÉÍÓÚÑ\s]*)(\d+)$/);
    const km=clean.match(/(\d+)\s*(?:rebuy|rebuys|ribuy|ribuys|ribeye|ribui|rebui|ribay)s?|\bx(\d+)\b/i);
    const tm=!km&&clean.match(/\s[-–]\s*(\d+)\s*$|\s(\d+)\s*$/);

    let rb=0,np=clean;
    if(gm){np=gm[1].trim();rb=parseInt(gm[2])||0;}
    else if(km){rb=parseInt(km[1]||km[2])||0;np=clean.replace(/\s*\(?\d+\s*(?:re?buys?|ribeye|ribui|ribay|ribuy)s?\)?/i,'').replace(/\s+x\d+\s*$/i,'').trim();}
    else if(tm){rb=parseInt(tm[1]||tm[2])||0;np=clean.replace(/\s*[-–]?\s*\d+\s*$/,'').trim();}

    // Check if name part is a keyword/reserved
    if(!np||np.length<2||RES.has(np.toLowerCase())||matchKeywordFamily(np.toLowerCase()))continue;

    const valid=np.length<=30&&/^[A-Za-záéíóúñÁÉÍÓÚÑ]/.test(np)&&!/^\d/.test(np);
    if((mode==='players'||(!mode&&valid))&&valid){
      // Exact match → add rebuys; fuzzy match → merge rebuys; else → new player
      const ex=parsedPlayers.find(p=>p.name.toLowerCase()===np.toLowerCase());
      if(ex){ex.rebuys=(parseInt(ex.rebuys)||0)+rb;}
      else{
        const fz=parsedPlayers.find(p=>similar(p.name,np));
        if(fz){fz.rebuys=(parseInt(fz.rebuys)||0)+rb;}
        else{parsedPlayers.push({id:uid(),name:np,rebuys:rb,cashout:0});}
      }
    }
  }

  if(!parsedPlayers.length&&Object.keys(cashoutMap).length>0)
    Object.values(cashoutMap).forEach(c=>parsedPlayers.push({id:uid(),name:c.name,rebuys:0,cashout:c.amount}));

  // Match cashouts → players (exact then fuzzy)
  const conflicts=[];
  for(const[k,co]of Object.entries(cashoutMap)){
    const ex=parsedPlayers.find(p=>p.name.toLowerCase()===k);
    if(ex){ex.cashout=co.amount;continue;}
    const fz=parsedPlayers.find(p=>similar(p.name,co.name));
    if(fz&&!fz.cashout){conflicts.push({playerName:fz.name,cashoutName:co.name,amount:co.amount,dismissed:false});fz.cashout=co.amount;}
  }

  if(!title&&lines.length>0){const f=lines[0].replace(/[🃏🎲♠♥♦♣*_~🔥]/g,'').trim();if(f.length<60&&!/:\s*\d/.test(f))title=f;}
  return{title,location:title,date:dateStr,players:parsedPlayers,cashoutMap,conflicts};
}

function detectAndParseSessions(rawText){
  const blocks=rawText.split(/(?:\n\s*){3,}|(?:^|\n)(?:---+|===+)\s*(?:\n|$)/m).map(b=>b.trim()).filter(b=>b.length>15);
  return blocks.map(block=>{
    const parsed=parseBlock(block);
    if(!parsed.players||parsed.players.length<2)return null;
    const date=parsed.date||null;
    return{...parsed,id:uid(),date:date||new Date().toLocaleDateString('es-CL'),month:getMonth(date||new Date().toLocaleDateString('es-CL')),locked:false,transactions:[],comments:[]};
  }).filter(Boolean);
}

// ─── Food transfers: direct per-payer calculations ──────────────────────────────
// Returns [{from, to, amount, label, payerId}] — each diner owes their share to each payer
function calcFoodTransfers(payers, dinersPerPayer){
  const transfers=[];
  for(const payer of payers){
    const amt=pm(payer.amount);if(!amt||!payer.name)continue;
    const diners=[...(dinersPerPayer[payer.id]||new Set())];
    if(!diners.length)continue;
    const share=Math.round(amt/diners.length);
    for(const diner of diners){
      if(diner!==payer.name&&share>0)
        transfers.push({from:diner,to:payer.name,amount:share,label:payer.label||'',payerId:payer.id});
    }
  }
  return transfers;
}

// ─── Consolidate poker + food transfers for same pair of players ──────────────
// Only merges when the SAME two people owe each other in BOTH poker AND food
function consolidateTransfers(pokerTx, foodTx){
  const KEY=(a,b)=>[a,b].sort().join('|||');
  const map={};
  const add=(from,to,amt,type)=>{
    const k=KEY(from,to);
    if(!map[k])map[k]={a:[from,to].sort()[0],b:[from,to].sort()[1],net:0,types:new Set()};
    map[k].net+=(from===map[k].a?amt:-amt);
    map[k].types.add(type);
  };
  pokerTx.forEach(t=>add(t.from,t.to,t.amount,'poker'));
  foodTx.forEach(t=>add(t.from,t.to,t.amount,'food'));
  // Only return pairs that appear in BOTH poker AND food
  return Object.values(map)
    .filter(x=>x.types.has('poker')&&x.types.has('food')&&Math.abs(x.net)>1)
    .map(x=>({
      from:x.net>0?x.a:x.b,
      to:x.net>0?x.b:x.a,
      amount:Math.round(Math.abs(x.net)),
      tag:'🤝 Consolidado'
    }));
}

    setNewName('');
  };
  const updP=(id,k,v)=>setPlayers(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));
  const delP=id=>{
    const p=players.find(x=>x.id===id);
    setPlayers(prev=>prev.filter(x=>x.id!==id));
    if(p){setFood(f=>{const d={...f.dinersPerPayer};Object.keys(d).forEach(pid=>{const s=new Set(d[pid]);s.delete(p.name);d[pid]=s;});return{...f,dinersPerPayer:d};});}
  };

  const addPayer=()=>{

    setFood(f=>({...f,payers:[...f.payers,{id:newId,name:'',amount:'',label:''}],dinersPerPayer:{...f.dinersPerPayer,[newId]:new Set(allNames)}}));
  };
  const updPayer=(id,k,v)=>setFood(f=>({...f,payers:f.payers.map(p=>p.id===id?{...p,[k]:v}:p)}));
  const delPayer=id=>setFood(f=>{const d={...f.dinersPerPayer};delete d[id];return{...f,payers:f.payers.filter(p=>p.id!==id),dinersPerPayer:d};});
  const toggleDiner=(payerId,playerName)=>setFood(f=>{
    const d={...f.dinersPerPayer};
    const s=new Set(d[payerId]||[]);
    s.has(playerName)?s.delete(playerName):s.add(playerName);
    return{...f,dinersPerPayer:{...d,[payerId]:s}};
  });
  const setAllDiners=(payerId,all)=>setFood(f=>{
    const d={...f.dinersPerPayer};
    d[payerId]=all?new Set(players.map(p=>p.name)):new Set();
    return{...f,dinersPerPayer:d};
  });

  // ── Calculations ──────────────────────────────────────────────────────────

  const validPayers=food.payers.filter(fp=>fp.name&&pm(fp.amount)>0);
  const foodTotal=validPayers.reduce((s,fp)=>s+pm(fp.amount),0);

  const pwb=players.map(p=>{
    const inv=(1+(parseInt(p.rebuys)||0))*buyIn;
    const co=parseInt(p.cashout)||0;
    const pk=co-inv;
    return{...p,investment:inv,cashout:co,pokerBalance:pk,finalBalance:pk};
  });
  const pokerTx=isOK?minimizeTx(pwb.map(p=>({...p,finalBalance:p.pokerBalance}))):[];

  const foodTx=useMemo(()=>foodTotal>0?calcFoodTransfers(validPayers,food.dinersPerPayer):[],[validPayers,food.dinersPerPayer,foodTotal]);
  const foodTxByPayer=useMemo(()=>{const g={};foodTx.forEach(t=>{if(!g[t.to])g[t.to]={payerName:t.to,label:t.label,transfers:[]};g[t.to].transfers.push(t);});return Object.values(g);},[foodTx]);
  const consolidatedTx=isOK&&foodTx.length>0?consolidateTransfers(pokerTx,foodTx):[];

  // ── Save / Lock ────────────────────────────────────────────────────────────
  const saveSession=()=>{
    const date=new Date().toLocaleDateString('es-CL');

    s.comments=generateComments(s);
    const ach=getAchievements(s);
    const nh=[s,...history].slice(0,200);
    setHistory(nh);saveLS(nh);setSaved(true);setTimeout(()=>setSaved(false),3000);
    setCM({comments:s.comments,achievements:ach});
  };

  const handleLock=sid=>{
    const doLock=()=>{const nh=history.map(s=>s.id===sid?{...s,locked:true,lockedAt:new Date().toLocaleDateString('es-CL')}:s);setHistory(nh);saveLS(nh);};
    if(!adminPin)setPinModal({mode:'set',onConfirm:pin=>{setAdminPin(pin);try{localStorage.setItem('pac_pin',pin);}catch(_){}doLock();setPinModal(null);}});
    else setPinModal({mode:'lock',onConfirm:pin=>{if(pin===adminPin){doLock();}setPinModal(null);}});
  };

  // ── Pronostico ─────────────────────────────────────────────────────────────
  const genPron=()=>{
    if(!players.length)return;
    const sh=rnd(players);
    const lo=rnd(players.filter(p=>p.name!==sh.name)||players);
    const funLines=[
      `🔮 Esta noche ${sh.name} se lleva todo. ${lo.name} termina pagando el Uber de regreso de otro.`,
      `🎱 La bola 8 dice: ${sh.name} gana, ${lo.name} sigue sin entender qué salió mal.`,
      `⚡ Alerta cósmica: ${sh.name} tiene la noche. ${lo.name} tiene el rebuy.`,
      `🌙 Las estrellas hablan: ${sh.name} vuelve a casa feliz. ${lo.name} vuelve a casa con lecciones.`,
    ];
    setPron(rnd(funLines));
  };

  const clearHist=()=>{const nh=history.filter(s=>s.locked);setHistory(nh);saveLS(nh);setConfirmClear(false);};

  // ── Stats ─────────────────────────────────────────────────────────────────
  const stats=useMemo(()=>{
    const map={};
    history.forEach(s=>s.players?.forEach(p=>{
      const n=p.name;
      if(!map[n])map[n]={name:n,gain:0,loss:0,rebuys:0,sessions:0,wins:0,sessionBals:[],maxGain:{v:0,where:''},maxLoss:{v:0,where:''},maxRb:{v:0,where:''}};
      const m=map[n];const bal=p.pokerBalance||0;const rb=parseInt(p.rebuys)||0;
      m.sessions++;m.rebuys+=rb;m.sessionBals.push(bal);
      if(bal>0){m.gain+=bal;m.wins++;if(bal>m.maxGain.v)m.maxGain={v:bal,where:s.title};}
      if(bal<0){m.loss+=Math.abs(bal);if(Math.abs(bal)>m.maxLoss.v)m.maxLoss={v:Math.abs(bal),where:s.title};}
      if(rb>m.maxRb.v)m.maxRb={v:rb,where:s.title};
    }));
    return Object.values(map).map(m=>{
      const net=m.gain-m.loss,avg=m.sessionBals.reduce((a,b)=>a+b,0)/(m.sessionBals.length||1);
      const sd=Math.sqrt(m.sessionBals.reduce((a,b)=>a+Math.pow(b-avg,2),0)/(m.sessionBals.length||1));
      return{...m,net,avg,stdDev:sd,winRate:m.sessions?Math.round(m.wins/m.sessions*100):0,mediocrity:Math.abs(avg)+sd*0.5};
    });
  },[history]);

  const byF=(fn,arr)=>[...arr].sort(fn)[0];
  const tiburon=byF((a,b)=>b.net-a.net,stats.filter(s=>s.net>0));
  const lloron=byF((a,b)=>b.loss-a.loss,stats);
  const donador=byF((a,b)=>b.rebuys-a.rebuys,stats);
  const kamikaze=byF((a,b)=>b.maxRb.v-a.maxRb.v,stats);
  const millonario=byF((a,b)=>b.maxGain.v-a.maxGain.v,stats);
  const catastrofe=byF((a,b)=>b.maxLoss.v-a.maxLoss.v,stats);
  const huevo=byF((a,b)=>a.mediocrity-b.mediocrity,stats.filter(s=>s.sessions>=2));
  const consistente=byF((a,b)=>b.winRate-a.winRate,stats.filter(s=>s.sessions>=2));

  const byMonth=useMemo(()=>{
    const m={};
    history.forEach(s=>{const mo=s.month||getMonth(s.date);if(!m[mo])m[mo]={sessions:[],players:{}};m[mo].sessions.push(s);
      s.players?.forEach(p=>{if(!m[mo].players[p.name])m[mo].players[p.name]={name:p.name,net:0,rebuys:0,sessions:0};m[mo].players[p.name].net+=p.pokerBalance||0;m[mo].players[p.name].rebuys+=(parseInt(p.rebuys)||0);m[mo].players[p.name].sessions++;});
    });
    return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0])).map(([mo,data])=>({month:mo,label:labelMonth(mo),sessions:data.sessions,players:Object.values(data.players).sort((a,b)=>b.net-a.net)}));
  },[history]);

  const rivalidades=useMemo(()=>{
    const pairs={};
    history.forEach(s=>{
      const pls=s.players||[];
      for(let i=0;i<pls.length;i++)for(let j=i+1;j<pls.length;j++){
        const[a,b]=[pls[i],pls[j]].sort((x,y)=>x.name.localeCompare(y.name));
        const key=`${a.name}|||${b.name}`;
        if(!pairs[key])pairs[key]={a:a.name,b:b.name,aNet:0,bNet:0,sessions:0};
        pairs[key].aNet+=(a.pokerBalance||0);pairs[key].bNet+=(b.pokerBalance||0);pairs[key].sessions++;
      }
    });
    return Object.values(pairs).filter(p=>p.sessions>=2).sort((a,b)=>b.sessions-a.sessions);
  },[history]);

  const allLoc=[...new Set(history.map(s=>s.location||s.title).filter(Boolean))];
  const allMonths=[...new Set(history.map(s=>s.month||getMonth(s.date)).filter(m=>m!=='sin-fecha'))].sort((a,b)=>b.localeCompare(a));
  const allPlayers=[...new Set(history.flatMap(s=>s.players?.map(p=>p.name)||[]))].sort();
  const filteredHist=history.filter(s=>{

      if(Math.abs(tI-tO)>50)return null;
      return{...s,buyIn:bi,players:pls,transactions:minimizeTx(pls.map(p=>({...p}))),comments:generateComments({...s,players:pls})};
    }).filter(Boolean);
    if(!toImport.length){setImportMsg('⚠️ No hay sesiones balanceadas para importar.');return;}
    const nh=[...toImport,...history].sort((a,b)=>b.id-a.id).slice(0,200);
    setHistory(nh);saveLS(nh);
    setImportMsg(`✅ ${toImport.length} sesión${toImport.length!==1?'es':''} importada${toImport.length!==1?'s':''}. ¡Historia reconstruida!`);

  // ── Style tokens ──────────────────────────────────────────────────────────

                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:8}}>

                  </p>

                        return(
                          <label key={i} style={{display:'flex',gap:9,alignItems:'flex-start',background:sel?'#052e16':'#0f172a',border:`1px solid ${sel?G.gain:G.brd}`,borderRadius:8,padding:'9px 11px',cursor:'pointer'}}>
                            <input type="checkbox" checked={sel} onChange={e=>setSelImp(p=>e.target.checked?[...p,i]:p.filter(x=>x!==i))} style={{marginTop:2}}/>
                            <div style={{flex:1}}>
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:4}}>
                                <span style={{fontWeight:700,fontSize:12}}>{s.title||'Sin título'}</span>
                                <div style={{display:'flex',gap:4}}>
                                  {s.date&&<span style={{fontSize:10,color:G.yl,background:G.yl+'22',borderRadius:4,padding:'1px 5px'}}>{s.date}</span>}
                                  {!ok&&<span style={{fontSize:10,color:G.loss,background:G.loss+'22',borderRadius:4,padding:'1px 5px'}}>⚠️ no cuadra</span>}
                                </div>
                              </div>
                              <p style={{fontSize:10,color:G.mt,marginTop:2}}>{s.players.length} jug: {s.players.map(p=>p.rebuys>0?`${p.name}(+${p.rebuys})`:p.name).join(', ')}</p>
                            </div>
                          </label>
                        );
                      })}
                    </div>
                    <button onClick={importSelected} disabled={!selImp.length} style={{background:selImp.length?G.or:'#334155',color:selImp.length?'#fff':G.mt,border:'none',borderRadius:8,padding:'9px 20px',fontWeight:800,fontSize:12,cursor:selImp.length?'pointer':'not-allowed'}}>
                      📥 Importar {selImp.length} sesión{selImp.length!==1?'es':''}
                    </button>
                  </div>
                )}

                <div style={{...card,borderColor:'#1e293b'}}>
                  <h3 style={{fontSize:12,fontWeight:700,marginBottom:5,color:G.mt}}>🔐 PIN de Administrador</h3>
                  <p style={{fontSize:11,color:G.mt,marginBottom:9}}>{adminPin?`PIN configurado (${adminPin.length} dígitos). Úsalo para sellar partidas en la vista Partidas.`:'Configura un PIN para sellar partidas definitivamente.'}</p>
                  <button onClick={()=>setPinModal({mode:'set',onConfirm:pin=>{setAdminPin(pin);try{localStorage.setItem('pac_pin',pin);}catch(_){}setPinModal(null);}})} style={{background:'transparent',border:`1px solid ${G.brd}`,borderRadius:7,padding:'5px 12px',color:G.mt,fontSize:11,fontWeight:700}}>
                    {adminPin?'🔑 Cambiar PIN':'🔐 Configurar PIN'}
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
